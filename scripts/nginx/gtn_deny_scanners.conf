# GTN 反扫描拦截（2026-09-19 起）
#
# 安装位置：/etc/nginx/snippets/gtn_deny_scanners.conf
# 用法：在 /etc/nginx/sites-available/gtn 的每个 server 块里
#       （server_name 之后一行）
#       include /etc/nginx/snippets/gtn_deny_scanners.conf;
#
# 背景：2026-09-19 19:13，单个 IP（34.62.116.145）一分钟内打了 280 次
# /.env、/.claude/settings.json、/.docker/config.json 之类的探测。单进程 eventlet
# 被这些无意义请求占满，nginx 对同一分钟里的正常玩家请求连续回 502，玩家看到
# 「服务器没有响应」。这些路径在 nginx 直接断开（444 = 不回包就关闭，最省资源），
# 不再进游戏进程。
#
# 注意 /.well-known/ 必须放行（certbot 续期），所以第一条用负向断言排除。
#
# 校验：
#   nginx -t && systemctl reload nginx
#   curl -s -o /dev/null -w '%{http_code}\n' https://gtn.stickerbug.top/.env        # 000
#   curl -s -o /dev/null -w '%{http_code}\n' https://gtn.stickerbug.top/wp-login.php # 000
#   curl -s -o /dev/null -w '%{http_code}\n' https://gtn.stickerbug.top/            # 200
#   curl -s -o /dev/null -w '%{http_code}\n' https://gtn.stickerbug.top/.well-known/acme-challenge/probe # 404（未拦截）
#   curl -s -o /dev/null -w '%{http_code}\n' "https://gtn.stickerbug.top/mods/Vanilla%20Cards.gtnmod"    # 200

location ~* ^/\.(?!well-known/) {
    access_log off;
    return 444;
}

location ~* \.(php|phtml|phar|asp|aspx|jsp|jspx|cgi|pl|rb|sql|bak|backup|old|orig|save|swp|swo|env|ini|cfg|conf|log|yml|yaml|toml|lock|dist|git|svn|hg)$ {
    access_log off;
    return 444;
}

location ~* ^/(wp-admin|wp-content|wp-includes|wp-json|wordpress|administrator|phpmyadmin|pma|myadmin|dbadmin|cgi-bin|vendor|node_modules|actuator|server-status|server-info|hudson|jenkins|manager/html|drupal|joomla|typo3|xmlrpc\.php|telescope|_ignition|solr|jmx-console|web-console|weblogic|axis2|struts|latest/meta-data) {
    access_log off;
    return 444;
}
