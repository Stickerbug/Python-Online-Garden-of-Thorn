<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="gtn-feedback-handling-csrf" content="{{ csrf_token|default('') }}">
<title>举报处理 · 荆棘花园</title>
  <link rel="stylesheet" href="/static/css/handling.css?v={{ static_version|default('dev')|urlencode }}">
</head>
<body>
<main id="app" class="hd-app hidden">
  <header class="hd-topbar">
    <div class="hd-topbar-inner">
      <a class="hd-brand" href="/feedback-center/bug" target="_blank" rel="noopener">
        <span class="hd-brand-mark">荆棘</span>
        <span class="hd-brand-text">
          <strong>举报处理</strong>
          <small>Staff Handling</small>
        </span>
      </a>
      <span id="summary" class="hd-muted">未加载</span>
      <div class="hd-top-actions">
        <button id="refresh" class="hd-button">刷新</button>
        <button id="handling-exit" class="hd-button">返回反馈</button>
      </div>
    </div>
  </header>

  <div id="action-result" class="hd-flash" aria-live="polite"></div>

  <nav class="hd-tabs" aria-label="处理视图">
    <button class="hd-tab is-active" data-tab="reports" type="button">举报</button>
    <button class="hd-tab" data-tab="users" type="button">玩家</button>
    <button class="hd-tab" data-tab="matches" type="button">对局</button>
    <button class="hd-tab" data-tab="risk" type="button">风险</button>
    <button class="hd-tab" data-tab="clusters" type="button">关联串</button>
    <button class="hd-tab" data-tab="moderation" type="button">处罚</button>
    <button class="hd-tab" data-tab="ip" type="button">IP 封禁</button>
  </nav>

  <div class="hd-toolbar">
    <div class="hd-toolbar-group" data-tools="reports">
      <label class="hd-field-inline">
        <span>状态</span>
        <select id="status-filter">
          <option value="all">全部</option>
          <option value="pending">待处理</option>
          <option value="accepted">已接受</option>
          <option value="rejected">已驳回</option>
          <option value="abusive">恶意举报</option>
        </select>
      </label>
    </div>
    <div class="hd-toolbar-group hidden" data-tools="users">
      <label class="hd-search">
        <span>搜索</span>
        <input id="user-query" placeholder="昵称 / 玩家ID / 注册顺序" autocomplete="off">
      </label>
      <label class="hd-field-inline">
        <span>排序</span>
        <select id="user-sort">
          <option value="last_login_at">最近登录</option>
          <option value="reputation">信誉分（低→高）</option>
          <option value="reputation_desc">信誉分（高→低）</option>
          <option value="created_at">注册时间</option>
          <option value="games_played">场次</option>
          <option value="win_rate">胜率</option>
        </select>
      </label>
      <label class="hd-field-inline">
        <span>信誉区间</span>
        <input id="user-rep-min" type="number" min="0" max="100" placeholder="最低" class="hd-num">
        <span class="hd-muted">~</span>
        <input id="user-rep-max" type="number" min="0" max="100" placeholder="最高" class="hd-num">
      </label>
      <button id="search-users" class="hd-button hd-button-primary">搜索玩家</button>
    </div>
    <div class="hd-toolbar-group hidden" data-tools="matches">
      <label class="hd-search">
        <span>搜索</span>
        <input id="match-query" placeholder="R-编号 / 对局ID / 玩家 / IP" autocomplete="off">
      </label>
      <label class="hd-field-inline">
        <span>模式</span>
        <select id="match-mode">
          <option value="all">全部模式</option>
          <option value="1v1">1v1</option>
          <option value="2v2">2v2</option>
          <option value="urf">无限火力</option>
          <option value="random_deck">随机卡组</option>
        </select>
      </label>
      <button id="search-matches" class="hd-button hd-button-primary">搜索对局</button>
    </div>
    <div class="hd-toolbar-group hidden" data-tools="risk">
      <button id="search-risk" class="hd-button hd-button-primary">读取风险对局</button>
      <span class="hd-muted">自动标记同 IP、早期投降、过短或不计分对局；仅供人工判断。</span>
    </div>
    <div class="hd-toolbar-group hidden" data-tools="clusters">
      <button id="search-clusters" class="hd-button hd-button-primary">读取关联串</button>
      <span class="hd-muted">按传递关系合并疑似 / 较可能 / 已确认账号。</span>
    </div>
    <div class="hd-toolbar-group hidden" data-tools="moderation">
      <label class="hd-field-inline">
        <span>类型</span>
        <select id="moderation-filter">
          <option value="all">全部有效处罚</option>
          <option value="account_ban">账号封禁</option>
          <option value="warning">警告</option>
          <option value="mute">禁言</option>
        </select>
      </label>
    </div>
    <div class="hd-toolbar-group hidden" data-tools="ip">
      <label class="hd-search">
        <span>搜索</span>
        <input id="ip-query" placeholder="IP 片段" autocomplete="off">
      </label>
      <label class="hd-check">
        <input type="checkbox" id="ip-include-inactive">
        <span>含已解除 / 已过期</span>
      </label>
      <button id="search-ip" class="hd-button hd-button-primary">搜索</button>
      <span class="hd-toolbar-divider" aria-hidden="true"></span>
      <label class="hd-search">
        <span>新增</span>
        <input id="ip-input" placeholder="IP" autocomplete="off">
      </label>
      <input id="ip-reason" placeholder="封禁原因" autocomplete="off" class="hd-grow">
      <button id="ban-ip" class="hd-button hd-button-danger">封禁 IP…</button>
    </div>
  </div>

  <div class="hd-split">
    <aside class="hd-list-pane" aria-label="记录列表">
      <div id="list" class="hd-list" aria-live="polite"></div>
      <div class="hd-pagination">
        <button id="page-prev" class="hd-button hd-button-small" type="button">上一页</button>
        <span id="page-info" class="hd-muted"></span>
        <button id="page-next" class="hd-button hd-button-small" type="button">下一页</button>
      </div>
    </aside>
    <section class="hd-detail-pane">
      <div id="empty" class="hd-empty">
        <div class="hd-empty-kicker">举报处理</div>
        <h2>选择左侧一条记录查看详情</h2>
        <p class="hd-muted">列表不会自动轮询，处理前先点「刷新」拿最新状态。</p>
      </div>
      <article id="detail" class="hd-detail hidden"></article>
    </section>
  </div>

  <footer class="hd-footer">
    <span>举报处理页在新标签页打开，不影响对局；所有操作都写入管理审计。</span>
  </footer>
</main>

<dialog id="hd-duration-dialog" class="hd-dialog">
  <div class="hd-dialog-head">
    <div>
      <h2 id="hd-duration-title">选择时长</h2>
      <p class="hd-muted">0 秒按永久处理（警告除外，最少 10 分钟）。</p>
    </div>
    <button class="hd-dialog-close" type="button" data-close-dialog aria-label="关闭">×</button>
  </div>
  <div class="hd-chip-row" id="hd-duration-quick">
    <button class="hd-chip" data-seconds="600">10 分钟</button>
    <button class="hd-chip" data-seconds="3600">1 小时</button>
    <button class="hd-chip" data-seconds="86400">1 天</button>
    <button class="hd-chip" data-seconds="604800">7 天</button>
    <button class="hd-chip" data-seconds="2592000">30 天</button>
    <button class="hd-chip hd-chip-danger" data-seconds="0">永久</button>
  </div>
  <label class="hd-field">
    <span>自定义（天 / 时 / 分）</span>
    <div class="hd-custom-duration">
      <input id="hd-duration-days" type="number" min="0" max="1000" value="0"><span>天</span>
      <input id="hd-duration-hours" type="number" min="0" max="23" value="0"><span>时</span>
      <input id="hd-duration-minutes" type="number" min="0" max="59" value="0"><span>分</span>
      <span class="hd-duration-total">合计 <b id="hd-duration-total">0</b> 秒</span>
    </div>
  </label>
  <div class="hd-dialog-actions">
    <button class="hd-button" type="button" data-close-dialog>取消</button>
    <button id="hd-duration-apply" class="hd-button hd-button-primary" type="button">确认</button>
  </div>
</dialog>

<dialog id="hd-confirm-dialog" class="hd-dialog">
  <div class="hd-dialog-head">
    <div>
      <h2 id="hd-confirm-title">确认</h2>
      <p id="hd-confirm-body" class="hd-muted"></p>
    </div>
    <button class="hd-dialog-close" type="button" data-close-dialog aria-label="关闭">×</button>
  </div>
  <div class="hd-dialog-actions">
    <button class="hd-button" type="button" data-close-dialog>取消</button>
    <button id="hd-confirm-apply" class="hd-button hd-button-danger" type="button">确认执行</button>
  </div>
</dialog>

<dialog id="hd-prompt-dialog" class="hd-dialog">
  <div class="hd-dialog-head">
    <div>
      <h2 id="hd-prompt-title">填写</h2>
      <p id="hd-prompt-hint" class="hd-muted"></p>
    </div>
    <button class="hd-dialog-close" type="button" data-close-dialog aria-label="关闭">×</button>
  </div>
  <label class="hd-field">
    <span id="hd-prompt-label">内容</span>
    <input id="hd-prompt-input" autocomplete="off">
  </label>
  <p id="hd-prompt-error" class="hd-error" role="alert"></p>
  <div class="hd-dialog-actions">
    <button class="hd-button" type="button" data-close-dialog>取消</button>
    <button id="hd-prompt-apply" class="hd-button hd-button-primary" type="button">确认</button>
  </div>
</dialog>

  <script src="/static/js/handling.js?v={{ static_version|default('dev')|urlencode }}"></script>
</body>
</html>
