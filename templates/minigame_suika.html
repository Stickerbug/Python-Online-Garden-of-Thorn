<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>合成大花花 · 休闲花园</title>
  <link rel="icon" href="/static/assets/favicon.ico">
  <link rel="stylesheet" href="/static/css/shared-lobby-chat.css?v={{ static_version|default('dev')|urlencode }}">
  <link rel="stylesheet" href="/static/css/minigame_suika.css?v={{ static_version|default('dev')|urlencode }}">
  <script nonce="{{ csp_nonce }}">
  (() => {
    const read = (key) => {
      try { return window.localStorage.getItem(key); } catch (_) { return null; }
    };
    const theme = read('gtn_theme') === 'dark' || read('gtn_beta_theme') === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
  </script>
  <script nonce="{{ csp_nonce }}">
  /* 兜底：模块/样式没加载出来（例如离线缓存不完整）时，别留一个空白页。
     CSP 禁了内联事件属性（script-src-attr 'none'），所以「重新加载」在这里用委托监听绑。 */
  window.__skBooted = false;
  window.setTimeout(() => {
    if (window.__skBooted) return;
    const box = document.getElementById('sk-boot-error');
    if (box) box.hidden = false;
  }, 6000);
  document.addEventListener('click', (event) => {
    if (event.target && event.target.id === 'sk-reload-btn') window.location.reload();
  });
  </script>
</head>
<body class="sk-page">
<main class="sk-frame">
  <p id="sk-boot-error" class="sk-boot-error" hidden>
    页面资源没有加载完整（可能是离线缓存或网络问题）。
    <button class="sk-btn small secondary" type="button" id="sk-reload-btn">重新加载</button>
  </p>

  <header class="sk-topbar">
    <div class="sk-topbar-row">
      <a class="sk-back" href="{{ back_href|default('/minigame') }}" title="返回休闲花园">← 休闲花园</a>
      {% if not user_id %}
      <span class="sk-guest-note">游客模式 · <a class="sk-login-link" href="/?login=1" target="_blank" rel="noopener">登录 / 注册</a> 后上榜</span>
      {% endif %}
    </div>
    <div class="sk-topbar-row">
      <div class="sk-brand">
        <h1 class="sk-title">合成大花花</h1>
        <p class="sk-status" role="status" aria-live="polite">
          <span id="sk-status">正在读取存档…</span>
          <span class="sk-sep">·</span>
          <span id="sk-verified">上榜最佳 0</span>
        </p>
      </div>
      <div class="sk-scores">
        <div class="sk-score-box">
          <span class="sk-score-label">分数</span>
          <strong id="sk-score" class="sk-score-value">0</strong>
        </div>
        <div class="sk-score-box">
          <span class="sk-score-label">最高纪录</span>
          <strong id="sk-best" class="sk-score-value">0</strong>
        </div>
        <button id="sk-new" class="sk-btn" type="button">新游戏</button>
      </div>
    </div>
  </header>

  <div id="sk-invite" class="sk-invite" hidden>
    <span id="sk-invite-text">收到对局邀请</span>
    <span class="sk-invite-actions">
      <button id="sk-invite-accept" class="sk-btn small" type="button">接受</button>
      <button id="sk-invite-decline" class="sk-btn secondary small" type="button">拒绝</button>
    </span>
  </div>

  <button id="sk-chat-toggle" class="sk-chat-toggle" type="button" aria-expanded="false">
    聊天
    <span id="sk-chat-unread" class="sk-chat-unread" hidden aria-label="没有未读消息">0</span>
  </button>
  <!-- 面板/标题/日志/输入行都复用多人游戏大厅那一套 gtn-lobby-chat-* 样式 -->
  <aside id="sk-chat" class="sk-chat gtn-lobby-chat-surface gtn-lobby-chat-standalone" hidden aria-label="聊天">
    <h3 class="gtn-lobby-chat-title">聊天</h3>
    <button id="sk-chat-close" class="sk-chat-close" type="button" aria-label="关闭聊天">×</button>
    <div id="sk-chat-log" class="gtn-lobby-chat-log" role="log" aria-live="polite"></div>
    <form id="sk-chat-form" class="gtn-lobby-chat-input-row">
      <input id="sk-chat-input" class="gtn-lobby-chat-input" type="text" maxlength="200" autocomplete="off" placeholder="输入消息...">
      <button id="sk-chat-send" class="gtn-lobby-chat-send" type="submit">发送</button>
    </form>
  </aside>

  <div class="sk-main">
    <aside class="sk-col sk-col-left">
      <section class="sk-card">
        <h2>合成路线</h2>
        <div id="sk-legend-grid" class="sk-chain-list" aria-label="合成顺序"></div>
      </section>
      <section class="sk-card">
        <h2>设置</h2>
        <label class="sk-switch">
          <input type="checkbox" id="sk-anim" checked>
          <span>动画效果</span>
        </label>
        <label class="sk-switch">
          <input type="checkbox" id="sk-aim" checked>
          <span>落点辅助线</span>
        </label>
        <label class="sk-switch">
          <input type="checkbox" id="sk-decline-invites">
          <span>拒绝对局邀请</span>
        </label>
      </section>
    </aside>

    <section class="sk-play">
      <div class="sk-canvas-holder">
        <canvas id="sk-canvas" class="sk-canvas" width="768" height="960"
                role="img" aria-label="合成大花花棋盘：点按或拖动选择位置，松手投放"></canvas>
        <div id="sk-overlay" class="sk-overlay" hidden>
          <div class="sk-overlay-card">
            <h2 id="sk-overlay-title">游戏结束</h2>
            <p id="sk-overlay-text">生物或花花堆过了失败线。</p>
            <p class="sk-overlay-score">本局分数 <strong id="sk-overlay-score">0</strong></p>
            <div class="sk-overlay-actions">
              <button id="sk-overlay-primary" class="sk-btn" type="button">再来一局</button>
              <button id="sk-overlay-secondary" class="sk-btn secondary" type="button" hidden>取消</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="sk-col sk-col-right">
      <section class="sk-card">
        <h2>下一枚</h2>
        <div class="sk-next-row">
          <span id="sk-next-chip" class="sk-next-ball" aria-hidden="true"></span>
          <div class="sk-next-text">
            <strong id="sk-next-name">—</strong>
            <span id="sk-next-hint" class="sk-next-hint">低分只会出小球</span>
          </div>
        </div>
      </section>
      <section class="sk-card">
        <h2>玩法</h2>
        <p class="sk-hint">
          拖动（或方向键 / A、D）选位置，松手（空格 / ↓）投放；两个相同生物撞在一起合成下一档。
        </p>
        <p class="sk-hint">
          分数越高，能抽到的档位越多。
        </p>
      </section>
      <section class="sk-card">
        <h2>排行榜</h2>
        <div class="sk-rank-tabs">
          <button class="sk-btn small" data-sk-window="14d" type="button" aria-pressed="true">最近 14 天</button>
          <button class="sk-btn small secondary" data-sk-window="all" type="button" aria-pressed="false">历史最高</button>
        </div>
        <div id="sk-rank-body" class="sk-rank-body">正在读取…</div>
        <p id="sk-rank-note" class="sk-hint"></p>
      </section>
    </aside>
  </div>
</main>

<script src="/static/vendor/matter.min.js?v=0.19.0"></script>
<script src="/static/vendor/socket.io.min.js?v=4.7.2"></script>
<script src="/static/js/shared-chat-actions.js?v={{ static_version|default('dev')|urlencode }}"></script>
<script src="/static/js/minigame-presence.js?v={{ static_version|default('dev')|urlencode }}"></script>
<script src="/static/js/minigame-chat.js?v={{ static_version|default('dev')|urlencode }}"></script>
<script type="application/json" id="sk-config">{{ {
  'username': username,
  'userId': user_id,
  'chatRole': chat_role|default('player'),
  'staticVersion': static_version|default('dev'),
  'gameKey': 'suika',
} | tojson }}</script>
<script type="module" src="/static/js/minigame_suika.js?v={{ static_version|default('dev')|urlencode }}"></script>
</body>
</html>
